---
interface:
  display_name: "LLM Wiki Capture"
  short_description: >
    Capture sessions and sources, audit a Wiki, or bootstrap one from zero.
  default_prompt: >
    Use $llm-wiki-capture to route this request into Session Capture, Source
    Ingest, Full Integration, Bootstrap, or review-only for an LLM Wiki.
policy:
  allow_implicit_invocation: false
