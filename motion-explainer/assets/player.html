<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Explainer</title>
  <style>
    /* motion-explainer-fonts */
    :root { color-scheme: light; --ink: #202723; --muted: #687069; --accent: #ffe066; --path: #1769c2; --paper: #f8f7f2; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
    body { font-family: "Motion Hand", "Animatic Hand", "Kaiti SC", "STKaiti", "PingFang SC", Georgia, serif; color: var(--ink); }
    #stage { width: 1280px; height: 720px; transform-origin: top left; position: relative; overflow: hidden; background: radial-gradient(#20272312 1px, transparent 1px) 0 0 / 24px 24px, var(--paper); }
    .scene { position: absolute; inset: 68px 76px 112px; transform-origin: 50% 45%; }
    .accent { width: 72px; height: 7px; border-radius: 3px 8px 4px 6px; background: var(--accent); transform-origin: left; rotate: -1deg; margin-bottom: 24px; }
    h1 { font-size: 46px; line-height: 1.3; letter-spacing: -1px; margin: 0 0 28px; font-weight: 650; white-space: pre-wrap; }
    .intro h1 { position: relative; width: fit-content; max-width: 100%; padding: 28px 38px; font-size: 76px; line-height: 1.25; letter-spacing: -2px; margin-top: 33px; margin-bottom: 25px; border: 2px solid #202723d9; border-radius: 255px 15px 225px / 15px 225px 15px 255px; background: #fffdf8; box-shadow: 4px 5px 0 #20272312; }
    .intro h1::before, .code-panel::before { content: ''; position: absolute; top: -13px; left: 42px; width: 80px; height: 24px; background: #eadab8b3; border: 1px solid #20272315; rotate: -3deg; }
    .title-line { display: block; position: relative; width: fit-content; isolation: isolate; }
    .title-line:first-child::after { content: ''; position: absolute; z-index: -1; left: -5px; right: -5px; bottom: 10%; height: 25%; border-radius: 3px 8px 4px 6px; background: var(--accent); transform: scaleX(var(--mark, 1)) rotate(-1deg); transform-origin: left; }
    .support { display: inline-block; margin: 0; padding: 10px 18px; font-size: 27px; line-height: 1.5; color: var(--muted); white-space: pre-wrap; background: #fff4ca; border: 1px solid #20272366; border-radius: 2px 15px; box-shadow: 3px 4px 0 #2027230c; rotate: -.4deg; }
    .flow { position: relative; display: flex; align-items: center; gap: 12px; margin-top: 85px; min-height: 148px; }
    .node { --lit: 0%; flex: 1; min-width: 0; height: 148px; padding: 18px; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; text-align: center; font-size: 32px; font-weight: 600; line-height: 1.4; border: 2px solid #202723b8; border-radius: 100px 12px 85px / 12px 85px 12px 100px; background: color-mix(in srgb, #fffdf8, #ffe88e var(--lit)); box-shadow: 4px 4px 0 #20272312; color: var(--ink); }
    .node:nth-of-type(even) { border-radius: 14px 8px 18px 7px / 7px 18px 8px 14px; }
    .flow.compact .node { font-size: 28px; }
    .node-label { max-width: 100%; }
    .sticker { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1.5px dashed #20272366; border-radius: 50%; background: #fffdf8; font: 30px/1 "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
    .connector { flex: none; width: 52px; height: 70px; overflow: visible; }
    .wire-base { stroke: #20272340; stroke-dasharray: 4 5; }
    .wire-lit { stroke: var(--path); stroke-dasharray: 64; }
    .wire-base, .wire-lit { fill: none; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    .packet { fill: var(--path); }
    .focus-ring { position: absolute; top: -3px; left: 0; height: 154px; border: 1.5px dashed #202723a6; border-radius: 100px 12px 85px / 12px 85px 12px 100px; pointer-events: none; }
    .code-panel { position: relative; border: 2px solid #202723b8; border-radius: 14px 8px 18px 7px; padding: 18px 0; background: #fffdf8; box-shadow: 4px 5px 0 #20272312; margin-top: 18px; font: 27px/1.5 "SFMono-Regular", Consolas, monospace; }
    .code-line { position: relative; padding: 0 26px; min-height: 1.5em; white-space: pre; z-index: 1; }
    .line-number { display: inline-block; width: 40px; color: #7d837c; }
    .code-text { display: inline-block; vertical-align: top; }
    .token-string { color: var(--path); }
    .token-number { color: #8a4a04; }
    .code-focus { position: absolute; left: 0; right: 0; background: #ffe06699; border-left: 4px solid #d6ae23; pointer-events: none; }
    #caption { position: absolute; left: 76px; right: 76px; bottom: 40px; margin: 0; max-height: 76px; font-size: 27px; line-height: 1.4; color: var(--ink); white-space: pre-wrap; }
    .caption-word { color: #73766f; }
    .caption-word.said { color: var(--ink); }
    .caption-word.now { color: var(--ink); background: linear-gradient(transparent 48%, #ffe066b3 48% 92%, transparent 92%); }
    #progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; transform-origin: left; background: var(--accent); }
  </style>
</head>
<body>
  <main id="stage">
    <div id="back" class="scene" aria-hidden="true"></div>
    <div id="front" class="scene"></div>
    <p id="caption"></p>
    <div id="progress"></div>
  </main>
  <script>
    /* motion-explainer-kit */
    const { clamp, mix, easeOutCubic: ease, element, spring, impact, createPlayerShell } = window.MotionKit;
    const front = document.getElementById('front');
    const back = document.getElementById('back');

    function codeTokens(text) {
      const fragment = document.createDocumentFragment();
      const pattern = /"(?:[^"\\]|\\.)*"|-?\b\d+(?:\.\d+)?\b/g;
      let offset = 0;
      for (const match of text.matchAll(pattern)) {
        fragment.append(document.createTextNode(text.slice(offset, match.index)));
        fragment.append(element('span', match[0].startsWith('"') ? 'token-string' : 'token-number', match[0]));
        offset = match.index + match[0].length;
      }
      fragment.append(document.createTextNode(text.slice(offset)));
      return fragment;
    }

    function mount(layer, storyboard, index) {
      if (layer.dataset.scene === String(index)) return;
      const scene = storyboard.scenes[index];
      layer.dataset.scene = String(index);
      layer.className = `scene${scene.layout === 'title' ? ' intro' : ''}`;
      layer.replaceChildren(element('div', 'accent'));
      const title = element('h1', '');
      if (scene.layout === 'title') {
        scene.title.split('\n').forEach(line => title.append(element('span', 'title-line', line)));
      } else title.textContent = scene.title;
      layer.append(title);
      if (scene.text) layer.append(element('p', 'support', scene.text));
      if (scene.layout === 'flow') {
        const flow = element('div', 'flow');
        flow.classList.toggle('compact', scene.items.length === 5);
        scene.items.forEach((item, i) => {
          if (i) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 52 70');
            svg.setAttribute('class', 'connector');
            for (const className of ['wire-base', 'wire-lit']) {
              const path = document.createElementNS(svg.namespaceURI, 'path');
              path.setAttribute('d', 'M 1 35 C 16 31 33 39 50 35 M 43 29 L 50 35 L 43 41');
              path.setAttribute('class', className);
              svg.append(path);
            }
            const packet = document.createElementNS(svg.namespaceURI, 'circle');
            packet.setAttribute('class', 'packet');
            packet.setAttribute('r', '3');
            packet.setAttribute('cy', '35');
            svg.append(packet);
            flow.append(svg);
          }
          const node = element('div', 'node');
          const parts = item.match(/^(\S+)\s+(.+)$/u);
          if (parts && /\p{Extended_Pictographic}/u.test(parts[1])) {
            const sticker = element('span', 'sticker', parts[1]);
            sticker.setAttribute('aria-hidden', 'true');
            node.append(sticker, element('span', 'node-label', parts[2]));
          } else node.append(element('span', 'node-label', item));
          flow.append(node);
        });
        flow.append(element('div', 'focus-ring'));
        layer.append(flow);
      }
      if (scene.layout === 'code') {
        const panel = element('div', 'code-panel');
        const lines = scene.code.split('\n');
        panel.style.fontSize = `${Math.max(20, Math.min(28, 350 / lines.length / 1.5))}px`;
        panel.append(element('div', 'code-focus'));
        lines.forEach((line, i) => {
          const row = element('div', 'code-line');
          const text = element('span', 'code-text');
          text.append(codeTokens(line));
          row.append(element('span', 'line-number', String(i + 1)), text);
          panel.append(row);
        });
        layer.append(panel);
      }
    }

    function bounds(nodes, focus) {
      const selected = focus.map(index => nodes[index]).filter(Boolean);
      if (!selected.length) return null;
      const left = Math.min(...selected.map(node => node.offsetLeft));
      const top = Math.min(...selected.map(node => node.offsetTop));
      return {
        left,
        top,
        width: Math.max(...selected.map(node => node.offsetLeft + node.offsetWidth)) - left,
        height: Math.max(...selected.map(node => node.offsetTop + node.offsetHeight)) - top,
      };
    }

    function paint(layer, frame, index, beatIndex, seconds, settled) {
      const { storyboard, timeline, scenes, visualTracks } = frame;
      mount(layer, storyboard, index);
      const meta = scenes[index];
      const previous = timeline[beatIndex - 1];
      const sameScene = previous?.scene === index;
      const age = Math.max(0, seconds - meta.start);
      const track = visualTracks[beatIndex];
      const eventIndex = settled ? track.length - 1 : Math.max(0, track.findLastIndex(event => seconds >= event.start));
      const state = track[eventIndex];
      const old = eventIndex
        ? track[eventIndex - 1]
        : sameScene
          ? visualTracks[beatIndex - 1].at(-1)
          : { focus: state.focus, show: 0 };
      const eventAge = Math.max(0, seconds - state.start);
      const transition = spring(eventAge, {
        stiffness: eventIndex ? 280 : 190,
        damping: eventIndex ? 24 : 21,
        settled,
      });
      const transitionClamped = clamp(transition);
      const oldFocus = old.focus;
      const reveal = (i, count) => {
        const shown = state.show ?? count;
        const oldShown = old.show ?? count;
        if (i >= shown) return 0;
        if (settled || i < oldShown) return 1;
        const stagger = Math.max(0, i - oldShown);
        return spring(eventAge - stagger * 0.11, {
          stiffness: eventIndex ? 250 : 185,
          damping: eventIndex ? 22 : 20,
          settled: false,
        });
      };

      layer.querySelector('.accent').style.transform = `scaleX(${clamp(spring(age, { stiffness: 160, damping: 20, settled }))})`;
      layer.querySelectorAll('.title-line').forEach((line, i) => {
        const p = spring(age - 0.12 - i * 0.16, { stiffness: 180, damping: 20, settled });
        line.style.opacity = clamp(p);
        line.style.transform = `translateY(${(1 - p) * 38}px)`;
        line.style.setProperty('--mark', settled ? 1 : ease((age - 0.25) / 0.7));
      });
      const support = layer.querySelector('.support');
      if (support) {
        const p = spring(age - 0.45, { stiffness: 190, damping: 21, settled });
        support.style.opacity = clamp(p);
        support.style.transform = `translateY(${(1 - p) * 16}px)`;
      }

      const nodes = [...layer.querySelectorAll('.node')];
      nodes.forEach((node, i) => {
        const p = reveal(i, nodes.length);
        const alpha = clamp(p);
        const lit = mix(oldFocus.includes(i) ? 1 : 0, state.focus.includes(i) ? 1 : 0, transitionClamped);
        node.style.opacity = alpha;
        node.style.transform = `translateY(${(1 - p) * 26}px) rotate(${(i % 2 ? 0.8 : -0.8) * (1 - alpha)}deg) scale(${0.96 + 0.04 * p})`;
        node.style.setProperty('--lit', `${lit * 100}%`);
        node.classList.toggle('active', state.focus.includes(i));
        const sticker = node.querySelector('.sticker');
        if (sticker) {
          const stamp = state.focus.includes(i)
            ? impact(eventAge, { intensity: 0.12, damping: 9, frequency: 18, offset: 3, settled })
            : { scaleX: 1, scaleY: 1 };
          const baseScale = 0.88 + 0.12 * alpha;
          sticker.style.transform = `rotate(${(i % 2 ? 1 : -1) * (1 - alpha) * 8}deg) scale(${(baseScale * stamp.scaleX).toFixed(4)}, ${(baseScale * stamp.scaleY).toFixed(4)})`;
        }
      });

      if (nodes.length) {
        const ring = layer.querySelector('.focus-ring');
        const target = bounds(nodes, state.focus);
        const origin = bounds(nodes, oldFocus) || target;
        ring.style.opacity = target ? (settled ? 1 : ease(age / 0.55)) : 0;
        if (target) {
          ring.style.left = `${mix(origin.left, target.left, transition) - 3}px`;
          ring.style.width = `${Math.max(0, mix(origin.width, target.width, transition) + 6)}px`;
        }
        const oldPosition = Math.max(0, ...oldFocus);
        const position = mix(oldPosition, Math.max(0, ...state.focus), transitionClamped);
        layer.querySelectorAll('.connector').forEach((svg, i) => {
          const p = clamp(position - i);
          const visible = i + 1 < (state.show ?? nodes.length);
          svg.style.opacity = visible ? clamp(reveal(i + 1, nodes.length)) : 0;
          svg.querySelector('.wire-lit').style.strokeDashoffset = 64 * (1 - p);
          const packet = svg.querySelector('.packet');
          const travel = p > 0 && p < 1 ? p : ((seconds - meta.start) % 1.9) / 1.9;
          packet.setAttribute('cx', String(1 + 49 * travel));
          packet.style.opacity = visible && p > 0 ? (settled ? 0 : 0.85) : 0;
        });
      }

      const rows = [...layer.querySelectorAll('.code-line')];
      rows.forEach((row, i) => {
        const p = reveal(i, rows.length);
        const alpha = clamp(p);
        row.style.opacity = alpha;
        row.style.transform = `translateX(${(1 - p) * 18}px)`;
        row.querySelector('.code-text').style.clipPath = `inset(0 ${(1 - alpha) * 100}% 0 0)`;
      });
      if (rows.length) {
        const band = layer.querySelector('.code-focus');
        const target = bounds(rows, state.focus);
        const origin = bounds(rows, oldFocus) || target;
        band.style.opacity = target ? (settled ? 1 : ease(age / 0.55)) : 0;
        if (target) {
          band.style.top = `${mix(origin.top, target.top, transition)}px`;
          band.style.height = `${Math.max(0, mix(origin.height, target.height, transition))}px`;
        }
      }
    }

    createPlayerShell({
      stage: '#stage',
      caption: '#caption',
      progress: '#progress',
      auditRoot: '#front',
      auditSelector: 'h1,.support,.node,.code-line',
      titleSelector: 'h1',
      onLoad() {
        front.dataset.scene = '';
        back.dataset.scene = '';
      },
      onSeek(frame) {
        const { time, settled, beatIndex, sceneIndex, sceneMeta, sceneAge, timeline } = frame;
        const entrancePos = spring(sceneAge, { stiffness: 175, damping: 21, settled });
        const entranceAlpha = settled ? 1 : ease(sceneAge / 0.45);
        paint(front, frame, sceneIndex, beatIndex, time, settled);
        const push = settled ? 0 : clamp(sceneAge / Math.max(1e-3, sceneMeta.end - sceneMeta.start)) * 0.018;
        front.style.opacity = entranceAlpha;
        front.style.transform = `translateX(${(1 - entrancePos) * 44}px) scale(${1 + push})`;
        back.style.opacity = 0;
        if (!settled && sceneIndex > 0 && sceneAge < 0.65) {
          const lastIndex = timeline.findLastIndex(previous => previous.scene === sceneIndex - 1);
          paint(back, frame, sceneIndex - 1, lastIndex, sceneMeta.start - 0.001, true);
          back.style.opacity = 1 - entranceAlpha;
          back.style.transform = `translateX(${-24 * entranceAlpha}px) scale(${1 + entranceAlpha * 0.02})`;
        }
      },
    });
  </script>
</body>
</html>
