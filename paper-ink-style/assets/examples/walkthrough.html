<!doctype html>
<html lang="zh-CN" data-surface="dot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>换配件这一步 · paper-ink-style specimen</title>
<!--
  Specimen · paper-ink-style · dials: canvas=dot, annot=on (device frame +
  pencil annotation), card=rough, note=translucent, stage=scroll.
  A specimen, not a template: look at the hand, then compose your own.
-->
<link rel="stylesheet" href="../base.css">
</head>
<body>
<main class="pvl-wrap">
  <p class="pvl-kicker">Experience walkthrough · 一幕一屏</p>
  <h1 class="pvl-title">换配件这一步，<span class="pvl-scribble">系统 Picker 原样保留</span></h1>
  <p class="pvl-lede">用户从工单点进配件选择：我们不重画系统界面，只把"哪一步真的变了"批注在外面。</p>

  <div class="pvl-cols">
    <div class="pvl-device">
      <div class="pvl-device__status"><span>9:41</span><div class="pvl-device__island"></div><span style="font-size:13px">5G</span></div>
      <div class="pvl-device__sheet" style="margin:10px 12px;padding:14px">
        <p style="margin:0;font-size:15px;font-weight:600">配件选择</p>
        <p style="margin:6px 0 0;font-size:13px;color:var(--pvl-muted)">系统 Picker 原样保留。</p>
      </div>
    </div>
    <div class="pvl-annot" style="padding:12px 16px;transform:rotate(-.6deg)">
      框内是真实界面，说系统的话；框外才是我们的手写声部。<span style="color:var(--pvl-pen-blue)">箭头指进真正变化的那一步：工单号自动带进搜索框。</span>
    </div>
  </div>

  <div class="pvl-note pvl-note--blue pvl-note--inline">别把系统 UI 重画一遍再批注重画版。</div>
  <p class="pvl-takeaway">体验细节留在框里，<span class="pvl-highlight">解释留在框外</span>。</p>
</main>
</body>
</html>
